<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t">
  <title id="t">A school dashboard with attendance and grades next to a target hit in the centre</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#ddd6fe"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#a5b4fc" opacity="0.55"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#4338ca" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#dots)"/>
  <circle cx="700" cy="70" r="120" fill="#c7d2fe" opacity="0.45"/>
  <circle cx="80" cy="410" r="110" fill="#c4b5fd" opacity="0.35"/>

  <!-- dashboard window -->
  <g filter="url(#shadow)">
    <rect x="70" y="70" width="420" height="300" rx="18" fill="#ffffff"/>
  </g>
  <path d="M70 88 a18 18 0 0 1 18 -18 h384 a18 18 0 0 1 18 18 v22 h-420 Z" fill="#eef2ff"/>
  <circle cx="94" cy="90" r="5" fill="#f87171"/>
  <circle cx="112" cy="90" r="5" fill="#fbbf24"/>
  <circle cx="130" cy="90" r="5" fill="#34d399"/>
  <rect x="160" y="82" width="200" height="16" rx="8" fill="#ffffff"/>

  <!-- stat tiles -->
  <g>
    <rect x="92" y="130" width="116" height="66" rx="12" fill="#eef2ff"/>
    <rect x="104" y="142" width="22" height="22" rx="7" fill="#6366f1"/>
    <rect x="104" y="174" width="56" height="9" rx="4.5" fill="#4338ca"/>
    <rect x="134" y="148" width="40" height="7" rx="3.5" fill="#c7d2fe"/>

    <rect x="222" y="130" width="116" height="66" rx="12" fill="#ecfdf5"/>
    <rect x="234" y="142" width="22" height="22" rx="7" fill="#10b981"/>
    <rect x="234" y="174" width="46" height="9" rx="4.5" fill="#047857"/>
    <rect x="264" y="148" width="40" height="7" rx="3.5" fill="#a7f3d0"/>

    <rect x="352" y="130" width="116" height="66" rx="12" fill="#fffbeb"/>
    <rect x="364" y="142" width="22" height="22" rx="7" fill="#f59e0b"/>
    <rect x="364" y="174" width="52" height="9" rx="4.5" fill="#b45309"/>
    <rect x="394" y="148" width="40" height="7" rx="3.5" fill="#fde68a"/>
  </g>

  <!-- attendance checklist -->
  <g>
    <rect x="92" y="212" width="190" height="136" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
    <g>
      <circle cx="114" cy="238" r="10" fill="#10b981"/>
      <path d="M109 238 l4 4 l7 -8" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="134" y="233" width="120" height="9" rx="4.5" fill="#cbd5e1"/>

      <circle cx="114" cy="270" r="10" fill="#10b981"/>
      <path d="M109 270 l4 4 l7 -8" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="134" y="265" width="96" height="9" rx="4.5" fill="#cbd5e1"/>

      <circle cx="114" cy="302" r="10" fill="#f59e0b"/>
      <rect x="110" y="300.5" width="8" height="3" rx="1.5" fill="#fff"/>
      <rect x="134" y="297" width="110" height="9" rx="4.5" fill="#cbd5e1"/>

      <circle cx="114" cy="330" r="8" fill="#e2e8f0"/>
      <rect x="134" y="326" width="70" height="8" rx="4" fill="#e2e8f0"/>
    </g>
  </g>

  <!-- grades bar chart -->
  <g>
    <rect x="296" y="212" width="172" height="136" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
    <line x1="312" y1="328" x2="452" y2="328" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <rect x="320" y="282" width="18" height="46" rx="5" fill="#a5b4fc"/>
    <rect x="348" y="258" width="18" height="70" rx="5" fill="#818cf8"/>
    <rect x="376" y="236" width="18" height="92" rx="5" fill="#6366f1"/>
    <rect x="404" y="268" width="18" height="60" rx="5" fill="#818cf8"/>
    <rect x="432" y="296" width="18" height="32" rx="5" fill="#a5b4fc"/>
  </g>

  <!-- target -->
  <g filter="url(#shadow)">
    <circle cx="610" cy="250" r="118" fill="#ffffff"/>
  </g>
  <circle cx="610" cy="250" r="100" fill="#6366f1"/>
  <circle cx="610" cy="250" r="76" fill="#ffffff"/>
  <circle cx="610" cy="250" r="52" fill="#818cf8"/>
  <circle cx="610" cy="250" r="29" fill="#ffffff"/>
  <circle cx="610" cy="250" r="12" fill="#f59e0b"/>

  <!-- arrow in the bullseye -->
  <g>
    <line x1="610" y1="250" x2="716" y2="144" stroke="#1e1b4b" stroke-width="6" stroke-linecap="round"/>
    <path d="M610 250 l6 -22 l16 16 Z" fill="#1e1b4b"/>
    <path d="M716 144 l22 -4 l-16 16 Z" fill="#f59e0b"/>
    <path d="M716 144 l4 -22 l-16 16 Z" fill="#fbbf24"/>
  </g>

  <!-- the three roles working together -->
  <g>
    <rect x="512" y="382" width="196" height="46" rx="23" fill="#ffffff" filter="url(#shadow)"/>
    <circle cx="544" cy="405" r="16" fill="#6366f1"/>
    <circle cx="544" cy="400" r="5.5" fill="#fff"/>
    <path d="M534 414 a10 9 0 0 1 20 0 Z" fill="#fff"/>
    <circle cx="578" cy="405" r="16" fill="#10b981" stroke="#fff" stroke-width="3"/>
    <circle cx="578" cy="400" r="5.5" fill="#fff"/>
    <path d="M568 414 a10 9 0 0 1 20 0 Z" fill="#fff"/>
    <circle cx="612" cy="405" r="16" fill="#f59e0b" stroke="#fff" stroke-width="3"/>
    <circle cx="612" cy="400" r="5.5" fill="#fff"/>
    <path d="M602 414 a10 9 0 0 1 20 0 Z" fill="#fff"/>
    <rect x="640" y="396" width="52" height="8" rx="4" fill="#c7d2fe"/>
    <rect x="640" y="409" width="36" height="6" rx="3" fill="#e0e7ff"/>
  </g>
</svg>
