version: "3.9"

services:
  mysql:
    image: mysql:8.4
    container_name: school_management_mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: school_management_db
      MYSQL_USER: user
      MYSQL_PASSWORD: password

    ports:
      - "3308:3306"

    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
